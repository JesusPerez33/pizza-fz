name: Pruebas Postman - Pizza FZ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas-postman:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Iniciar Pizza FZ
        run: |
          mvn -B spring-boot:run > app.log 2>&1 &
          echo $! > app.pid

      - name: Esperar a que inicie Pizza FZ
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:8080/api/carrito/1 > /dev/null; then
              echo "Pizza FZ está funcionando."
              exit 0
            fi
            sleep 5
          done
          echo "Pizza FZ no inició correctamente."
          cat app.log
          exit 1

      - name: Ejecutar pruebas de Postman
        run: |
          npx --yes newman run "postman/My Collection.postman_collection.json" \
            --env-var "baseUrl=http://localhost:8080"
